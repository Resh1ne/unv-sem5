version: "v2.29.7-desktop.1"
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: pbz
    ports:
      - "5433:5432"
    volumes:
      - "//c/Users/User/IdeaProjects/unv-sem5/SQL/scriptForCreatingTable.sql:/docker-entrypoint-initdb.d/scriptForCreatingTable.sql"


  app:
